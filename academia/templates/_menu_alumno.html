{% load static %}
<style>
  /* Nav fijo debajo del header (80px) + auth-overlay (48px) = 128px */
  .nav-alumno {
    position: fixed;
    top: 128px;
    left: 0;
    right: 0;
    z-index: 998;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background-color: #2f6300;
  }

  .nav-alumno a {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 8px;
    color: #fff;
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
    font-size: .85rem;
    font-weight: 500;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,.15);
    transition: background .2s;
  }

  .nav-alumno a:last-child {
    border-right: none;
  }

  .nav-alumno a:hover {
    background-color: rgba(255,255,255,.14);
  }

  .nav-alumno a.nav-activo {
    background-color: #6abf30;
    font-weight: 700;
  }

  .nav-alumno-spacer {
    height: 160px;
  }
</style>

<nav class="nav-alumno">
  <a href="{% url 'mis_clases' %}"  {% if activo == 'mis_clases'  %}class="nav-activo"{% endif %}>Mis Clases</a>
  <a href="{% url 'reservar' %}"   {% if activo == 'reservar'   %}class="nav-activo"{% endif %}>Reservar</a>
  <a href="{% url 'perfil' %}"     {% if activo == 'perfil'     %}class="nav-activo"{% endif %}>Mi Perfil</a>
  <a href="{% url 'reglamento' %}" {% if activo == 'reglamento' %}class="nav-activo"{% endif %}>Reglamento</a>
</nav>

<div class="nav-alumno-spacer"></div>
